<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <!-- CRITICAL: Use interactive-widget=resizes-content for keyboard handling -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Workout Completato - Viltrum Fitness</title>
  
  <!-- CRITICAL: Inline styles to prevent FOUC in PWA standalone mode -->
  <style id="fouc-prevention">
    /* Hide all form elements initially to prevent native styling flash */
    select, input:not([type="checkbox"]):not([type="radio"]), button { 
      -webkit-appearance: none !important; 
      -moz-appearance: none !important;
      appearance: none !important;
    }
    /* Ensure black background shows immediately */
    html, body { background: #000000 !important; }
  </style>
  
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../css/design-system.css?v=20260819a" />
  <link rel="stylesheet" href="../css/main.css?v=20260819b">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="../viewport.js"></script>
  <style>
    /* LAYOUT CONTRACT
       The page itself never scrolls. The container is exactly one screen tall
       and only the exercise list inside it scrolls, so the action buttons are
       always on screen without scrolling to them.

       This replaces a "sticky bottom bar" that could never work: the bar sat
       inside .completion-container, which had overflow-y:auto but only a
       min-height. A box like that grows with its content instead of scrolling,
       so it became the sticky element's scroll container while never actually
       scrolling - position:sticky had nothing to stick to and the bar just sat
       at the natural bottom of the page, below the fold. */
    html, body {
      margin: 0;
      padding: 0;
      background: #000000;
      font-family: 'Archivo', system-ui, sans-serif;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    .completion-container {
      display: flex;
      flex-direction: column;
      /* --app-h is the visible height in px, kept in sync with visualViewport
         so the buttons stay above the on-screen keyboard. 100dvh is the
         fallback for the first paint and for browsers without visualViewport. */
      height: 100dvh;
      height: var(--app-h, 100dvh);
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
      box-sizing: border-box;
      background: #000000;
      overflow: hidden;
    }

    .completion-header {
      flex-shrink: 0;
      text-align: center;
      padding: 1.5rem 2rem 1rem 2rem;
    }

    .completion-title {
      font-family: 'Archivo', system-ui, sans-serif;
      font-size: clamp(1.8rem, 6vw, 2.5rem);
      color: #FFFFFF;
      margin-bottom: 0.25rem;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .completion-workout-name {
      font-family: 'Archivo', system-ui, sans-serif;
      font-size: clamp(1rem, 3.5vw, 1.25rem);
      color: #B0B0B0;
      margin-bottom: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .completion-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      padding: 0 2rem;
      margin-bottom: 1rem;
      flex-shrink: 0;
    }

    .stat-item {
      background: var(--ds-surface);
      padding: 0.75rem;
      border-radius: 10px;
      border: 1px solid var(--ds-border);
    }

    .stat-label {
      font-family: 'Archivo', system-ui, sans-serif;
      font-size: 0.75rem;
      color: #B0B0B0;
      margin-bottom: 0.15rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stat-value {
      font-family: 'Archivo', system-ui, sans-serif;
      font-size: 1.5rem;
      font-weight: normal;
      color: var(--accent);
      letter-spacing: 1px;
    }

    /* WEIGHT LOGGING SECTION
       This is the one part of the screen that scrolls. min-height:0 on every
       flex ancestor is required: without it a flex item refuses to shrink below
       its content height, the list pushes the buttons off screen and the
       overflow never engages. */
    .weight-logging-section {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      padding: 0 2rem 0.5rem 2rem;
    }

    .weight-logging {
      display: flex;
      flex-direction: column;
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
    }

    /* The scroller. Everything else on the screen stays put. */
    #exercise-weights {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    .weight-logging h3 {
      flex-shrink: 0;
      font-family: 'Archivo', system-ui, sans-serif;
      font-size: 1rem;
      color: #FFFFFF;
      margin-bottom: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .weight-logging h3::before {
      content: "🏋️";
      font-size: 1.1rem;
    }

    .exercise-weight-input {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 0.6rem;
      padding: 0.6rem 0.75rem;
      background: var(--ds-surface);
      border-radius: 8px;
      border: 1px solid var(--ds-border);
    }

    .exercise-weight-input label {
      flex: 1;
      font-family: 'Archivo', system-ui, sans-serif;
      color: #FFFFFF;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      line-height: 1.2;
    }

    .exercise-weight-input input {
      width: 90px;
      padding: 0.6rem 0.5rem;
      background: var(--ds-bg);
      border: 1px solid var(--ds-border-field);
      border-radius: 8px;
      color: #FFFFFF;
      font-family: 'Archivo', system-ui, sans-serif;
      font-size: 1rem;
      letter-spacing: 1px;
      text-align: center;
      flex-shrink: 0;
    }

    .exercise-weight-input input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .weight-input-row {
      display: flex;
      gap: 0.35rem;
      align-items: center;
      flex-shrink: 0;
    }

    .kbd-toggle {
      width: 38px;
      padding: 0.6rem 0;
      background: var(--ds-control);
      border: 1px solid var(--ds-border-modal);
      border-radius: 8px;
      color: #FFFFFF;
      font-family: 'Archivo', system-ui, sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .kbd-toggle:active {
      background: rgba(255, 255, 255, 0.15);
    }

    .exercise-weight-input .previous-weight {
      font-family: 'Archivo', system-ui, sans-serif;
      font-size: 0.7rem;
      color: var(--ds-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    /* ACTION BUTTONS - LAST ROW OF THE FIXED-HEIGHT COLUMN.
       No position:sticky. It is simply the final flex child of a container that
       is exactly one screen tall, so it is always visible and never moves. */
    .action-buttons-container {
      flex-shrink: 0;
      padding: 0.75rem 2rem calc(0.75rem + env(safe-area-inset-bottom));
      background: #000000;
      border-top: 1px solid var(--ds-border);
      z-index: 10;
    }

    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    /* While the keyboard is up the visible area is roughly half a screen.
       Drop the celebration header, the stats and the info note so the exercise
       list keeps a usable height and the buttons stay reachable. */
    body.keyboard-open .completion-header,
    body.keyboard-open .completion-stats,
    body.keyboard-open .weights-info {
      display: none;
    }

    /* Short screens: everything above the list is fixed overhead, so on a small
       phone the list was down to about two visible rows. Give it back ~90px by
       tightening the chrome. Nothing is hidden, only compacted. */
    @media (max-height: 720px) {
      .completion-header { padding: 0.75rem 2rem 0.5rem 2rem; }
      .completion-title { font-size: 1.5rem; letter-spacing: 1px; }
      .completion-workout-name { font-size: 0.9rem; margin-bottom: 0.4rem; }
      .completion-stats { margin-bottom: 0.6rem; gap: 0.5rem; }
      .stat-item { padding: 0.5rem; }
      .stat-value { font-size: 1.2rem; }
      .weight-logging h3 { margin-bottom: 0.5rem; font-size: 0.9rem; }
      .weights-info { display: none; }
      .action-button { padding: 0.75rem 1.5rem; font-size: 0.9rem; }
      .action-buttons { gap: 0.5rem; }
    }

    .action-button {
      padding: 0.9rem 1.5rem;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      border: none;
      font-family: 'Archivo', system-ui, sans-serif;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      /* No double-tap-zoom delay, and the browser must never reinterpret a tap
         on these as the start of a pan gesture (that turns pointerup into
         pointercancel and the press is silently dropped). */
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    .action-button[disabled],
    .action-button.is-busy {
      opacity: 0.6;
      pointer-events: none;
    }

    .action-button.primary {
      background: var(--accent);
      color: var(--accent-ink);
      border: none;
    }

    .action-button.primary:active {
      transform: scale(0.98);
      background: var(--accent-hover);
    }

    .action-button.secondary {
      background: transparent;
      color: var(--ds-text-4);
      border: 1px solid var(--ds-border-strong);
    }

    .action-button.secondary:active {
      transform: scale(0.98);
      background: rgba(255, 255, 255, 0.2);
    }

    .share-message {
      margin-top: 0.75rem;
      padding: 0.75rem;
      background: var(--accent-a08);
      border: 1px solid rgba(193,255,114,0.3);
      border-radius: 10px;
      color: #FFFFFF;
      font-family: 'Archivo', system-ui, sans-serif;
      font-size: 0.8rem;
      text-align: center;
      letter-spacing: 1px;
      display: none;
    }

    .share-message.show {
      display: block;
    }
    
    /* Where weights info */
    .weights-info {
      flex-shrink: 0;
      margin-top: 0.5rem;
      padding: 0.5rem 0.75rem;
      background: rgba(106, 176, 76, 0.15);
      border: 1px solid rgba(106, 176, 76, 0.3);
      border-radius: 8px;
      color: #B0B0B0;
      font-size: 0.7rem;
      text-align: center;
      letter-spacing: 0.5px;
    }
    
    .weights-info strong {
      color: #FFFFFF;
    }
  </style>
</head>
<body>
  <div class="completion-container" id="completion-container">
    <div class="completion-header">
      <h1 class="completion-title">OTTIMO LAVORO!</h1>
      <p class="completion-workout-name" id="workout-name">Workout</p>
    </div>
    
    <div class="completion-stats">
      <div class="stat-item">
        <div class="stat-label">Durata</div>
        <div class="stat-value" id="duration">--:--</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Esercizi</div>
        <div class="stat-value" id="exercise-count">--</div>
      </div>
    </div>

    <div class="weight-logging-section">
      <div class="weight-logging" id="weight-logging">
        <h3>REGISTRA I PESI USATI</h3>
        <div id="exercise-weights"></div>
        <div class="weights-info" id="weights-info">
          💾 I pesi vengono salvati <strong>su questo dispositivo</strong>
        </div>
      </div>
    </div>

    <div class="action-buttons-container">
      <div class="action-buttons">
        <button type="button" id="share-btn" class="action-button primary">
          CONDIVIDI SU INSTAGRAM STORY
        </button>
        <button type="button" id="save-btn" class="action-button secondary">
          SALVA E TORNA ALLA DASHBOARD
        </button>
      </div>

      <div class="share-message" id="share-message">
        Risultato copiato negli appunti
      </div>
    </div>
  </div>

  <script src="../js/global-preload-bar.js"></script>
  <script type="module">
    import { addWorkoutToHistory, shareWorkoutCompletion } from '../js/workout-history.js';
    import { getExerciseWeight } from '../js/workout-history.js';
    import { apiPost } from '../js/api.js';

    // ========== VIEWPORT HEIGHT ==========
    // Pin the container to the height that is actually visible right now.
    // 100dvh alone is not enough: browsers disagree about whether the on-screen
    // keyboard shrinks it, and when it does not, the button row ends up behind
    // the keyboard. visualViewport.height is the one measurement that is always
    // the real visible area.
    const container = document.getElementById('completion-container');

    function syncAppHeight() {
      const vv = window.visualViewport;
      const h = Math.round(vv ? vv.height : window.innerHeight);
      if (h > 0) document.documentElement.style.setProperty('--app-h', h + 'px');
    }
    syncAppHeight();

    // ========== KEYBOARD HANDLING ==========
    if (window.visualViewport) {
      const onViewportChange = () => {
        syncAppHeight();
        const keyboardOpen = window.visualViewport.height < window.innerHeight * 0.75;
        document.body.classList.toggle('keyboard-open', keyboardOpen);

        // Scroll focused input into view (inside the list, which is the scroller)
        if (keyboardOpen && document.activeElement && document.activeElement.tagName === 'INPUT') {
          setTimeout(() => {
            document.activeElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }, 100);
        }
      };
      window.visualViewport.addEventListener('resize', onViewportChange);
      window.visualViewport.addEventListener('scroll', syncAppHeight);
    }
    window.addEventListener('resize', syncAppHeight);
    window.addEventListener('orientationchange', () => setTimeout(syncAppHeight, 200));

    // Method 2: Focus/blur events as backup
    document.querySelectorAll('input').forEach(input => {
      input.addEventListener('focus', () => {
        document.body.classList.add('keyboard-open');
        setTimeout(() => {
          input.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 300);
      });
      
      input.addEventListener('blur', () => {
        setTimeout(() => {
          if (!document.activeElement || document.activeElement.tagName !== 'INPUT') {
            document.body.classList.remove('keyboard-open');
          }
        }, 100);
      });
    });

    // Get workout data from sessionStorage.
    // The stored value can be the literal string "undefined" when the workout
    // came from plan-view and the writer had no name to store. That is a
    // non-empty string, so a plain `|| 'Workout'` let "UNDEFINED" reach the
    // title. workout.js now writes a real name; this guard covers sessions
    // stored by an older build.
    const storedName = (sessionStorage.getItem('completedWorkout') || '').trim();
    const workoutName =
      (!storedName || storedName === 'undefined' || storedName === 'null')
        ? 'Workout'
        : storedName;
    const duration = parseInt(sessionStorage.getItem('workoutDuration')) || 0;
    const exerciseCount = parseInt(sessionStorage.getItem('exerciseCount')) || 0;
    
    // Get exercise list from sessionStorage
    let exercises = [];
    try {
      const exercisesJson = sessionStorage.getItem('workoutExercises');
      if (exercisesJson) {
        exercises = JSON.parse(exercisesJson);
      }
    } catch (e) {
      console.error('Error parsing exercises:', e);
    }

    // Display workout info
    document.getElementById('workout-name').textContent = workoutName;
    
    const minutes = Math.floor(duration / 60);
    const seconds = duration % 60;
    document.getElementById('duration').textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
    document.getElementById('exercise-count').textContent = exerciseCount || exercises.length || '--';

    // Create weight input fields for exercises
    const weightContainer = document.getElementById('exercise-weights');
    if (exercises.length > 0) {
      // WHICH EXERCISES GET A ROW
      //
      // This used to be a whitelist: an exercise only appeared if its name or
      // its equipment text contained one of ~18 hard-coded keywords. Anything
      // the list did not anticipate vanished with no warning, and the list was
      // not even internally consistent - it had "manubrio" but not the plural
      // "manubri", so "due manubri intermedi" only survived when the exercise
      // name happened to contain another keyword. Every unlisted word -
      // elastico, palla medica, sacco, giubbotto zavorrato, anelli - meant a
      // silently missing row and a weight the user could not record.
      //
      // It is now a blacklist, which fails the safe way round: show every
      // exercise, and only drop the ones that provably cannot carry a weight.
      // Worst case is one extra row the user leaves blank; the old worst case
      // was losing data.
      const NO_WEIGHT_EQUIPMENT = /corpo\s*libero|body\s*?weight|senza\s+(attrezz|peso)|nessun|solo\s+corpo/i;
      const NOT_AN_EXERCISE = /\b(rest|riposo|pausa|recupero)\b|istruz|blocco|^block\b|good\s*job|riscaldamento/i;

      const seenExercises = new Set();
      const filteredExercises = exercises.filter(exercise => {
        if (!exercise || !exercise.name) return false;

        const name = exercise.name.trim();
        const tipo = (exercise.tipoDiPeso || '').trim();
        if (!name) return false;

        // Sequence scaffolding, not something you lift.
        if (NOT_AN_EXERCISE.test(name)) return false;

        // Explicitly bodyweight -> there is no weight to write down.
        if (tipo && NO_WEIGHT_EQUIPMENT.test(tipo)) return false;

        // Dedup on name + equipment, so the same movement done with two
        // different loads still gets two rows, but the repeated rounds of one
        // block collapse into one.
        const compositeKey = tipo
          ? `${name.toLowerCase()}|${tipo.toLowerCase()}`
          : name.toLowerCase();
        if (seenExercises.has(compositeKey)) return false;
        seenExercises.add(compositeKey);

        return true;
      });

      console.log(`🏋️ Weight rows: ${filteredExercises.length} of ${exercises.length} sequence entries`);

      if (filteredExercises.length > 0) {
        filteredExercises.forEach((exercise, index) => {
          const previousWeight = getExerciseWeight(exercise.name, exercise.tipoDiPeso);
          const tipLabel = exercise.tipoDiPeso ? `<span style="opacity:0.6;font-size:12px;"> — ${exercise.tipoDiPeso}</span>` : '';
          // Store composite key in data attribute for save
          const dataKey = exercise.tipoDiPeso 
            ? `${exercise.name}|${exercise.tipoDiPeso}`
            : exercise.name;
          
          const div = document.createElement('div');
          div.className = 'exercise-weight-input';
          div.innerHTML = `
            <label>
              ${exercise.name}${tipLabel}
              ${previousWeight ? `<br><span class="previous-weight">Ultimo: ${previousWeight}</span>` : ''}
            </label>
            <div class="weight-input-row">
              <input
                type="text"
                inputmode="decimal"
                id="weight-${index}"
                data-exercise-name="${dataKey}"
                placeholder="es. 20kg"
                value="${previousWeight || ''}"
              >
              <button type="button" class="kbd-toggle" data-target="weight-${index}" title="Cambia tastiera">ABC</button>
            </div>
          `;
          weightContainer.appendChild(div);
        });
        
        // Update weights info based on login status
        const weightsInfoEl = document.getElementById('weights-info');
        const userEmail = localStorage.getItem('loggedUser');
        if (weightsInfoEl) {
          if (userEmail) {
            weightsInfoEl.innerHTML = '☁️ I pesi vengono sincronizzati sul <strong>cloud</strong> e saranno visibili su tutti i dispositivi';
            weightsInfoEl.style.borderColor = 'rgba(106, 176, 76, 0.5)';
          } else {
            weightsInfoEl.innerHTML = '💾 I pesi vengono salvati <strong>solo su questo dispositivo</strong>';
            weightsInfoEl.style.borderColor = 'rgba(176, 176, 176, 0.3)';
          }
        }
        
        // Re-attach keyboard handlers to dynamically created inputs
        document.querySelectorAll('.exercise-weight-input input').forEach(input => {
          input.addEventListener('focus', () => {
            document.body.classList.add('keyboard-open');
            setTimeout(() => {
              input.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 300);
          });
          
          input.addEventListener('blur', () => {
            setTimeout(() => {
              if (!document.activeElement || document.activeElement.tagName !== 'INPUT') {
                document.body.classList.remove('keyboard-open');
              }
            }, 100);
          });
        });

        // Keyboard toggle: switch between numeric and full keyboard
        document.querySelectorAll('.kbd-toggle').forEach(btn => {
          btn.addEventListener('click', () => {
            const input = document.getElementById(btn.dataset.target);
            if (!input) return;
            const toText = input.getAttribute('inputmode') !== 'text';
            input.setAttribute('inputmode', toText ? 'text' : 'decimal');
            btn.textContent = toText ? '123' : 'ABC';
            // Blur + refocus forces mobile keyboard to re-render with new mode
            input.blur();
            input.focus();
          });
        });
      } else {
        document.getElementById('weight-logging').style.display = 'none';
      }
    } else {
      document.getElementById('weight-logging').style.display = 'none';
    }

    // Share to Instagram
    window.shareToInstagram = function() {
      // Use native share API which works better on mobile
      if (navigator.share) {
        const shareData = {
          title: 'Viltrum Fitness - Workout Completato!',
          text: `Ho completato "${workoutName}" su Viltrum Fitness!\nDurata: ${minutes}:${seconds.toString().padStart(2, '0')}\nEsercizi: ${exerciseCount || exercises.length}\n\n#ViltrumFitness #Workout #Fitness`,
          url: window.location.origin
        };
        
        navigator.share(shareData)
          .then(() => {
            const message = document.getElementById('share-message');
            message.textContent = 'Condiviso con successo!';
            message.classList.add('show');
            setTimeout(() => {
              message.classList.remove('show');
            }, 3000);
          })
          .catch((err) => {
            console.log('Share cancelled or failed:', err);
            // Fallback to copying text
            fallbackShare();
          });
      } else {
        // Fallback for browsers that don't support Web Share API
        fallbackShare();
      }
    };
    
    function fallbackShare() {
      const shareText = `Ho completato "${workoutName}" su Viltrum Fitness!\nDurata: ${minutes}:${seconds.toString().padStart(2, '0')}\nEsercizi: ${exerciseCount || exercises.length}\n\n#ViltrumFitness #Workout #Fitness\n\n${window.location.origin}`;
      
      if (navigator.clipboard) {
        navigator.clipboard.writeText(shareText)
          .then(() => {
            const message = document.getElementById('share-message');
            message.textContent = 'Testo copiato! Incollalo nella tua Storia Instagram.';
            message.classList.add('show');
            setTimeout(() => {
              message.classList.remove('show');
            }, 5000);
          })
          .catch(() => {
            const message = document.getElementById('share-message');
            message.textContent = 'Impossibile copiare il testo';
            message.classList.add('show');
            setTimeout(() => {
              message.classList.remove('show');
            }, 3000);
          });
      } else {
        const message = document.getElementById('share-message');
        message.textContent = 'Funzione di condivisione non disponibile';
        message.classList.add('show');
        setTimeout(() => {
          message.classList.remove('show');
        }, 3000);
      }
    }

    // ═══════════════════════════════════════════════════════════════════════
    // SAVE + RETURN
    //
    // Why this button used to "sometimes not work":
    //   1. It awaited two Apps Script calls back to back, and apiPost sets no
    //      timeout. On a weak connection - roaming, gym wifi, a captive portal -
    //      fetch just sits there. Nothing was broken and nothing was shown; the
    //      page simply never got to the redirect, so the button looked dead.
    //   2. There was no busy state, so a second tap re-entered the whole thing
    //      and wrote a second history entry.
    //
    // Now: the local save happens first and is what actually matters, the two
    // cloud calls run in parallel under one deadline, and the redirect happens
    // no matter how they end. A timed-out request is not cancelled - it may
    // still land - and the weights are in localStorage either way, so nothing
    // is lost.
    // ═══════════════════════════════════════════════════════════════════════
    const CLOUD_SYNC_DEADLINE_MS = 6000;

    /** Resolve either way, never hang. Returns 'timeout' if the deadline wins. */
    function withDeadline(promise, ms, label) {
      return Promise.race([
        Promise.resolve(promise).catch(err => {
          console.warn(`⚠️ ${label} failed (saved locally):`, err);
          return 'error';
        }),
        new Promise(resolve => setTimeout(() => {
          console.warn(`⏱️ ${label} still pending after ${ms}ms - continuing without it`);
          resolve('timeout');
        }, ms))
      ]);
    }

    let saveInFlight = false;

    // Save workout and return to dashboard
    window.saveAndReturn = async function() {
      if (saveInFlight) return;          // a second tap must not re-run this
      saveInFlight = true;

      const saveBtn = document.getElementById('save-btn');
      const originalLabel = saveBtn ? saveBtn.textContent : '';
      if (saveBtn) {
        saveBtn.classList.add('is-busy');
        saveBtn.textContent = 'SALVATAGGIO…';
      }

      // Whatever happens below, leave this screen.
      const leave = () => {
        sessionStorage.removeItem('completedWorkout');
        sessionStorage.removeItem('workoutDuration');
        sessionStorage.removeItem('exerciseCount');
        sessionStorage.removeItem('workoutExercises');
        sessionStorage.removeItem('completedWorkoutIndex');
        sessionStorage.removeItem('totalUserWorkouts');

        // V7: Check if coming from plan-view
        const v7PlanInfo = sessionStorage.getItem('v7PlanInfo');
        if (v7PlanInfo) {
          sessionStorage.removeItem('v7PlanInfo');
          window.location.href = 'plan-view.html';
        } else {
          // Return to dashboard (v9 fix: was legacy dashboard.html)
          window.location.href = 'dashboard-v7.html';
        }
      };

      try {
        // Collect weight data from all inputs
        const weights = {};
        const weightInputs = document.querySelectorAll('.exercise-weight-input input[data-exercise-name]');

        weightInputs.forEach(input => {
          if (input.value.trim()) {
            const exerciseName = input.getAttribute('data-exercise-name');
            weights[exerciseName] = input.value.trim();
          }
        });

        // Save to history (local storage - immediate, and the source of truth)
        addWorkoutToHistory(workoutName, duration, weights);

        const userEmail = localStorage.getItem('loggedUser');
        const completedWorkoutIndex = sessionStorage.getItem('completedWorkoutIndex');

        // Local index write is unconditional - the cloud copy is a bonus.
        if (completedWorkoutIndex !== null) {
          localStorage.setItem('viltrum_last_workout_index', completedWorkoutIndex);
        }

        const pending = [];

        // Which workout was just completed, so next time we auto-select the next one
        if (completedWorkoutIndex !== null && userEmail) {
          console.log('📤 Syncing last workout to cloud:', completedWorkoutIndex, workoutName);
          // V9: POST + session token; server writes the token owner's row.
          pending.push(apiPost('saveLastWorkout', {
            lastWorkoutIndex: parseInt(completedWorkoutIndex),
            lastWorkoutName: workoutName
          }));
        }

        // The weights themselves
        if (userEmail && Object.keys(weights).length > 0) {
          // Get full weights from localStorage (merged by addWorkoutToHistory)
          const allWeights = JSON.parse(localStorage.getItem('viltrum_exercise_weights') || '{}');
          console.log('📤 Syncing weights to cloud before redirect...');
          // V9: POST + session token. Also removes the old ~2000-char GET URL
          // ceiling, which silently truncated large weight payloads.
          pending.push(apiPost('saveWeights', { weights: JSON.stringify(allWeights) }));
        }

        if (pending.length > 0) {
          // In parallel and under one shared deadline, not one after the other.
          await withDeadline(Promise.all(pending), CLOUD_SYNC_DEADLINE_MS, 'Cloud sync');
        }
      } catch (e) {
        // Never strand the user on this screen because a save step threw.
        console.error('❌ saveAndReturn error (leaving anyway):', e);
        if (saveBtn) saveBtn.textContent = originalLabel;
      }

      leave();
    };

    // Reliable taps for the bottom action buttons.
    //
    // Two separate things ate presses here:
    //
    // 1. Layout moving mid-tap. With a weight input focused the keyboard is up.
    //    A normal tap blurs the input first, the keyboard closes, the viewport
    //    grows, the button slides down out from under the finger and the click
    //    lands on nothing. preventDefault on pointerdown stops the blur, so
    //    nothing moves while the finger is down.
    //
    // 2. The press being reclassified as a scroll. preventDefault on pointerdown
    //    also suppresses the synthesized click, so the click fallback was gone -
    //    and if the browser decided the small finger drift was a pan, it sent
    //    pointercancel instead of pointerup and NOTHING fired at all. That is
    //    the "sometimes it doesn't work". setPointerCapture claims the gesture
    //    for the button, so the pointer stream cannot be stolen and pointerup is
    //    guaranteed to arrive here. touch-action:manipulation in the CSS closes
    //    the same hole from the other side.
    function bindTap(el, fn) {
      if (!el) return;
      let firedAt = 0;
      const run = () => {
        const now = Date.now();
        if (now - firedAt < 700) return; // de-dupe pointerup + synthesized click
        firedAt = now;
        fn();
      };

      el.addEventListener('pointerdown', (e) => {
        // Keep the focused input focused during the press -> no reflow mid-tap.
        if (e.cancelable) e.preventDefault();
        try { el.setPointerCapture(e.pointerId); } catch (_) { /* older engines */ }
      });

      el.addEventListener('pointerup', (e) => {
        try { el.releasePointerCapture(e.pointerId); } catch (_) {}
        // With pointer capture the event arrives even if the finger drifted off
        // the button, so honour the release point: outside = cancelled press.
        const r = el.getBoundingClientRect();
        const inside = e.clientX >= r.left && e.clientX <= r.right &&
                       e.clientY >= r.top  && e.clientY <= r.bottom;
        if (inside) run();
      });

      el.addEventListener('pointercancel', (e) => {
        try { el.releasePointerCapture(e.pointerId); } catch (_) {}
      });

      // Desktop, keyboard activation, and engines without pointer events.
      el.addEventListener('click', run);
    }

    bindTap(document.getElementById('save-btn'), () => saveAndReturn());
    bindTap(document.getElementById('share-btn'), () => shareToInstagram());
  </script>
  <script src="../js/version.js"></script>
  <script src="../js/update-notifier.js"></script>
</body>
</html>
