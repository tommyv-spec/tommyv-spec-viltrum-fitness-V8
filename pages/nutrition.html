<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Nutrition - Viltrum Fitness</title>
  
  <!-- CRITICAL: Inline styles to prevent FOUC in PWA standalone mode -->
  <style id="fouc-prevention">
    /* Hide all form elements initially to prevent native styling flash */
    select, input:not([type="checkbox"]):not([type="radio"]), button { 
      -webkit-appearance: none !important; 
      -moz-appearance: none !important;
      appearance: none !important;
    }
    /* Ensure black background shows immediately */
    html, body { background: #000000 !important; }
  </style>
  
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/design-system.css?v=20260818w1" />
  <link rel="stylesheet" href="../css/main.css?v=20260818w9" />
  
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-title" content="Viltrum Fitness" />
  <link rel="apple-touch-icon" href="../icons/icon-192x192.png" />
  <link rel="stylesheet" href="../css/nutrition.css?v=20260818w4" />
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; min-height: 100vh; font-family: 'Archivo', system-ui, sans-serif; background: #000; color: #FFF; overflow-x: hidden; overflow-y: auto !important; }
    /* Header usa stili globali da main.css */
    main { min-height: calc(100vh - 80px); max-width: 1200px; margin: 0 auto; padding: 20px; padding-bottom: 80px; }
    .page-header { text-align: center; margin-bottom: 30px; }
    .page-header h1 { font-size: clamp(36px, 5vw, 54px); margin-bottom: 10px; letter-spacing: 2px; }
    .page-header p { color: #B0B0B0; font-size: clamp(16px, 2.5vw, 20px); }
    .expired-banner { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.4); border-radius: 15px; padding: 20px; margin-bottom: 30px; text-align: center; }
    .expired-banner h2 { color: var(--ds-danger); font-size: 24px; margin-bottom: 10px; }
    .no-plan { background: var(--ds-surface); border: 1px solid var(--ds-border); border-radius: 20px; padding: 40px; text-align: center; margin: 50px 0; }
    .no-plan h2 { font-size: 28px; margin-bottom: 15px; }
    .no-plan p { color: #B0B0B0; font-size: 18px; line-height: 1.6; }
    .meal-nav { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 30px; }
    .meal-summary { background: var(--ds-sunken); border: 1px solid var(--ds-border-inner); border-radius: 15px; padding: 25px; margin-top: 30px; }
    .meal-summary h3 { font-size: 24px; margin-bottom: 20px; text-align: center; }
    .summary-foods { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--ds-border-inner); }
    .summary-foods h4 { color: #B0B0B0; font-size: 16px; margin-bottom: 12px; }
    .summary-foods ul { list-style: none; padding: 0; }
    .summary-foods li { font-size: 15px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .summary-foods li:last-child { border-bottom: none; }
    .btn { padding: 14px 28px; background: var(--accent); color: var(--accent-ink); border: none; border-radius: 10px; font-size: 16px; font-weight: bold; font-family: 'Archivo', system-ui, sans-serif; cursor: pointer; transition: all 0.3s; letter-spacing: 1px; }
    .btn:hover { background: var(--accent-hover); transform: translateY(-2px); }
    .btn-save { width: 100%; margin-top: 20px; font-size: 18px; padding: 16px; }
    
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); overflow-y: auto; }
    .modal-content { background: var(--ds-surface-modal); margin: 5% auto; padding: 30px; border: 1px solid var(--ds-border-modal); border-radius: 16px; width: 90%; max-width: 600px; }
    .modal-content h3 { font-size: 28px; margin-bottom: 20px; }
    .modal-content p { color: #B0B0B0; font-size: 16px; line-height: 1.6; margin-bottom: 15px; }
    .btn-close-modal { margin-top: 20px; width: 100%; }
    .loading { text-align: center; padding: 50px; color: #B0B0B0; font-size: 18px; }
    @media (max-width: 768px) { .options-grid { grid-template-columns: 1fr; } .meal-nav { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <header>
    <div class="header-left"></div>
    <div class="header-center">
      <div style="display:flex;align-items:center;gap:10px;">
        <div aria-hidden="true" style="width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);flex-shrink:0;">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6.5 6.5h11M6.5 17.5h11M4 12h16M7 6.5v11M17 6.5v11"/></svg>
        </div>
        <div style="font-weight:800;font-size:15px;letter-spacing:1px;color:var(--ds-text);">VILTRUM</div>
      </div>
    </div>
    <div class="header-right">
      <a href="dashboard-v7.html" class="header-action-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Dashboard</span>
      </a>
    </div>
  </header>
  <main>
    <div class="page-header">
      <h1>NUTRITION</h1>
      <p id="user-name-display">Il tuo piano alimentare</p>
    </div>
    <div id="app-container"><div class="loading">Caricamento piano alimentare...</div></div>
  </main>
  <div id="nutrition-modal" class="modal"><div class="modal-content"></div></div>
  <script src="../viewport.js"></script>
  <script src="../js/offline-preloader.js"></script>
  <script src="../js/global-preload-bar.js"></script>
  <script src="../js/nutrition-engine.js"></script>
  <script type="module" src="../js/nutrition-app-v2.js"></script>
  
  <!-- V8: Load logo from cache, global preload bar handles progress -->
  <script type="module">
    document.addEventListener('DOMContentLoaded', async () => {
      // Load logo from cache
      const headerLogo = document.getElementById('header-logo') || document.querySelector('header img');
      if (headerLogo) {
        const logoUrl = headerLogo.getAttribute('data-src') || headerLogo.src;
        if (logoUrl && logoUrl !== window.location.href) {
          let attempts = 0;
          while (typeof OfflinePreloader === 'undefined' && attempts < 30) {
            await new Promise(resolve => setTimeout(resolve, 50));
            attempts++;
          }
          
          if (typeof OfflinePreloader !== 'undefined') {
            try {
              const cachedLogoUrl = await OfflinePreloader.getCachedImage(logoUrl);
              if (cachedLogoUrl) {
                headerLogo.src = cachedLogoUrl;
              } else {
                headerLogo.src = logoUrl;
              }
            } catch (error) {
              headerLogo.src = logoUrl;
            }
          } else {
            headerLogo.src = logoUrl;
          }
          headerLogo.style.opacity = '1';
        }
      }
      
      // V8: Preload continues automatically via GlobalPreloadBar
      // No need to manually trigger - auth.js/dashboard already started it
    });
  </script>
  <script src="../js/update-notifier.js"></script>
</body>
</html>
