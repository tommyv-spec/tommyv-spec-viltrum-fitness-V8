<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Workout - Viltrum Fitness</title>
  
  <!-- CRITICAL: Inline styles to prevent FOUC in PWA standalone mode -->
  <style id="fouc-prevention">
    /* Hide all form elements initially to prevent native styling flash */
    select, input:not([type="checkbox"]):not([type="radio"]), button { 
      -webkit-appearance: none !important; 
      -moz-appearance: none !important;
      appearance: none !important;
    }
    /* Ensure black background shows immediately */
    html, body { background: #000000 !important; }
  </style>
  
  <link href="https://fonts.googleapis.com/css2?family=Staatliches&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/design-system.css?v=20260818w0" />
  <link rel="stylesheet" href="../css/main.css?v=20260818w2" />
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-title" content="Viltrum Fitness" />
  <link rel="apple-touch-icon" href="../icons/icon-192x192.png" />
  
  <style>
    /* Hide header during workout */
    body.workout-active header {
      display: none !important;
    }
    /* During active workout, remove safe-area top (full screen) */
    body.workout-active .app {
      padding-top: 0 !important;
    }
    /* Override global main safe-area-bottom — #bottom-buttons-container is position:fixed
       and #main-app height already accounts for footer-total, no extra padding needed */
    .workout-page main {
      padding-bottom: 0 !important;
    }
  </style>
  <!-- Real viewport height before first paint -->
  <script>
    (function(){
      function setH(){
        var h = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
        document.documentElement.style.setProperty('--dvh-px', h + 'px');
      }
      setH();
      window.addEventListener('resize', setH, {passive:true});
      if(window.visualViewport){
        window.visualViewport.addEventListener('resize', setH, {passive:true});
      }
    })();
  </script>
</head>
<body class="workout-page">
<div class="app">
  <header>
    <div class="header-left" id="header-left">
      <!-- Back button verrà aggiunto via JS se necessario -->
    </div>
    <div class="header-center">
      <img id="header-logo" data-src="https://lh3.googleusercontent.com/d/1va6OkGp9yAHDJBfeDM3npwqlJJoLUh5C" alt="Logo" style="opacity: 0;" />
    </div>
    <div class="header-right">
      <a href="dashboard-v7.html" class="header-action-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Dashboard</span>
      </a>
    </div>
  </header>

  <main>
    <!-- MAIN APP - NO LOGIN SECTION HERE -->
    <div id="main-app">
      <!-- TOP SELECTOR ABOVE THE SETUP CARD -->
      <div id="topbar-select">
        <label for="workoutSelect">Seleziona workout:</label>
        <select id="workoutSelect"></select>
      </div>

      <div id="setup-screen">
        <!-- INSTRUCTIONS SECTION (Collapsible) -->
        <div id="instructions-section" style="display: none;">
          <div class="instructions-header" id="instructions-header">
            <span class="instructions-icon"></span>
            <span class="instructions-title">ISTRUZIONI</span>
            <span class="collapse-icon" id="instructions-collapse-icon">▼</span>
          </div>
          <div id="instructions-content" class="instructions-content">
            <div id="instructions-box">
              <p id="instructions-text"></p>
              <img id="instructions-image" style="display: none;" />
            </div>
          </div>
        </div>

        <!-- MATERIALE SECTION -->
        <div id="materiale-section" style="display: none;">
          <div class="materiale-header">
            <span class="materiale-icon"></span>
            <span class="materiale-title">MATERIALE</span>
          </div>
          <div id="materiale-content" class="materiale-content">
            <div id="materiale-list"></div>
          </div>
        </div>

        <h3 id="workout-preview-title" style="display: none; text-align: center; color: #fff; margin: 30px 0 20px; font-size: 18px; text-transform: uppercase; letter-spacing: 1px;">Anteprima workout</h3>

        <div id="exercise-visuals" style="display: none; margin-top: 20px;">
          <div id="exercise-grid" style="display: grid; grid-template-columns: 1fr; gap: 20px;"></div>
        </div>

        <!-- START POINT SELECTOR -->
        <div id="start-point-selector" style="display: none; margin: 30px 0; padding: 20px; background: rgba(255,255,255,0.05); border-radius: 12px; border: 2px solid rgba(176,176,176,0.3);">
          <h3 style="color: #B0B0B0; margin-bottom: 15px; text-align: center; font-size: 16px;"> Inizia da un blocco specifico</h3>
          
          <div style="display: grid; gap: 15px;">
            <div>
              <label for="start-phase-select" style="display: block; color: #fff; margin-bottom: 5px; font-size: 14px;">Blocco:</label>
              <select id="start-phase-select" style="width: 100%; padding: 10px; border-radius: 8px; background: #4D4D4D; color: #fff; border: 1px solid #7D7D7D;">
                <option value="0">Inizio workout</option>
              </select>
            </div>

            <div id="start-round-container" style="display: none;">
              <label for="start-round-select" style="display: block; color: #fff; margin-bottom: 5px; font-size: 14px;">Round:</label>
              <select id="start-round-select" style="width: 100%; padding: 10px; border-radius: 8px; background: #4D4D4D; color: #fff; border: 1px solid #7D7D7D;">
              </select>
            </div>

            <div id="start-exercise-container" style="display: none;">
              <label for="start-exercise-select" style="display: block; color: #fff; margin-bottom: 5px; font-size: 14px;">Esercizio:</label>
              <select id="start-exercise-select" style="width: 100%; padding: 10px; border-radius: 8px; background: #4D4D4D; color: #fff; border: 1px solid #7D7D7D;">
              </select>
            </div>

            <button id="reset-start-point" style="padding: 8px 15px; background: rgba(255,255,255,0.1); color: #fff; border: 1px solid #7D7D7D; border-radius: 8px; cursor: pointer; font-size: 13px;">
              ⟲ Reset a inizio workout
            </button>
          </div>
        </div>
      </div>

      <!-- SETUP SETTINGS POPUP -->
      <!-- v9: one voice, no options (msg Giuseppe 2026-08-10). Only mute stays;
           the soundMode select survives hidden because workout.js reads its value. -->
      <div id="setup-settings-popup" style="display: none;">
        <div class="settings-content">
          <h3>Impostazioni</h3>

          <select id="soundMode-setup" style="display: none;" aria-hidden="true" tabindex="-1">
            <option value="eleven">🎙️ Istruttore</option>
            <option value="voice">Voice (Cloud TTS)</option>
            <option value="synth">Synth (Device)</option>
            <option value="bip">Beep</option>
            <option value="none">Nessun suono</option>
          </select>

          <div style="margin-top: 10px;">
            <label style="display: flex; align-items: center; cursor: pointer;">
              <input type="checkbox" id="mute-toggle-setup" style="margin-right: 10px; width: 20px; height: 20px; cursor: pointer;">
              <span>Silenzia audio</span>
            </label>
          </div>

          <button id="close-setup-settings">Chiudi</button>
        </div>
      </div>



      <!-- SESSIONE ALLENAMENTO -->
      <div id="exercise-container" style="display: none; flex-direction: column;">
        <!-- 0. PROGRESS BAR + FAB (PRIMA RIGA) -->
        <div id="workout-progress-header">
          <div id="workout-progress-container">
            <div id="progress-bar-wrapper">
              <div id="progress-bar">
                <div id="progress-fill"></div>
                <div id="progress-percentage">0%</div>
              </div>
            </div>
            <div id="progress-info">
              <span id="progress-block">Block 1/3</span>
              <span id="progress-round">Round 1/4</span>
              <span id="progress-exercise">Exercise 1/5</span>
            </div>
          </div>
          
        </div>

        <!-- CONTROLLI — v9: sempre visibili a schermo, niente menu a sandwich
             (audio 2026-08-11 pt.8; il tap sul ☰ interferiva anche con la voce) -->
        <div id="controls-container">
          <button id="prev-exercise-button" class="nav-btn" title="Esercizio precedente">◀</button>
          <button id="pause-button">⏸ Pausa</button>
          <button id="add-10s-button" class="add-time-btn" title="Aggiungi 10 secondi">+10s</button>
          <button id="next-exercise-button" class="nav-btn" title="Esercizio successivo">▶</button>
          <button id="settings-button" class="settings-btn" title="Impostazioni">⚙</button>
        </div>

        <!-- 1. TIMER -->
        <div id="timer" class="full-timer"></div>
      
        <!-- 2. NOME ATTUALE -->
        <div id="exercise-name"></div>
      
        <!-- 3. GIF ATTUALE -->
        <div id="exercise-gif-viewport">
          <img id="exercise-gif" src="" alt="Esercizio corrente" />
        </div>

      </div>

        <!-- Settings Popup Overlay -->
        <!-- v9: one voice, no options. Mute + Termina Allenamento only; hidden
             soundMode select kept because workout.js reads its value. -->
        <div id="settings-popup" style="display: none;">
          <div class="settings-content">
            <h3>Impostazioni</h3>

            <select id="soundMode" style="display: none;" aria-hidden="true" tabindex="-1">
              <option value="eleven">🎙️ Istruttore</option>
              <option value="voice">Voice (Cloud TTS)</option>
              <option value="synth">Synth (Device)</option>
              <option value="bip">Beep</option>
              <option value="none">Nessun suono</option>
            </select>

            <div style="margin-bottom: 20px;">
              <label style="display: flex; align-items: center; cursor: pointer;">
                <input type="checkbox" id="mute-toggle" style="margin-right: 10px; width: 20px; height: 20px; cursor: pointer;">
                <span>Silenzia audio</span>
              </label>
            </div>

            <button id="exit-workout-button">
              Termina Allenamento
            </button>
            <button id="close-settings">Chiudi</button>
          </div>
        </div>



        <!-- FIX per JS -->
        <div id="next-exercise-preview" style="display: none;"></div>
      </div>

    </div>
  </main>
    <!-- STICKY BUTTONS AT BOTTOM -->
  <div id="bottom-buttons-container">
    <button id="setup-settings-button" class="settings-btn" title="Impostazioni">⚙️</button>

    <button id="start-button-bottom" class="start-button" disabled>Start Workout</button>
  </div>

  <!-- AUDIO -->
  <!-- Local WAV, not the old actions.google.com .ogg: WebKit cannot decode Ogg, so
       these were silent on Safari and iOS. -->
  <audio id="beep-sound" src="../audio/beep.wav" preload="auto" playsinline webkit-playsinline></audio>
  <audio id="transition-sound" src="../audio/transition.wav" preload="auto" playsinline webkit-playsinline></audio>
</div><!-- /.app -->

  <!-- JS -->
  <script>
    // AUTH CHECK - Use localStorage which is set by login
    if (!localStorage.getItem('loggedUser')) {
      window.location.href = '../index.html';
    }
  </script>
  <script src="../js/offline-preloader.js"></script>
  <script src="../js/global-preload-bar.js"></script>
  <script type="module" src="../js/workout.js"></script>
  <script src="../viewport.js"></script>
  
  <!-- V8: Global preload bar handles progress display automatically -->
  <script src="../js/update-notifier.js"></script>
</body>
</html>
